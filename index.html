<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClankerCom</title>
  <link rel="stylesheet" href="renderer/styles.css">
</head>
<body>

  <!-- ============ Title bar ============
       Drawn here rather than by the OS, so the window frame matches the
       console. The drag region gives back native move, snap, and
       double-click-to-maximize. -->
  <header class="titlebar">
    <div class="titlebar-drag">
      <span class="titlebar-mark"><svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4.5v9L12 21l-7-4.5v-9z"/><circle cx="12" cy="12" r="2.5"/></svg></span>
      <span class="titlebar-name">ClankerCom</span>
    </div>

    <div class="window-controls">
      <button class="window-control" id="win-minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" /></svg>
      </button>
      <button class="window-control" id="win-maximize" aria-label="Maximize">
        <svg viewBox="0 0 10 10" aria-hidden="true" id="win-maximize-icon">
          <rect x="0.5" y="0.5" width="9" height="9" />
        </svg>
      </button>
      <button class="window-control window-control--close" id="win-close" aria-label="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" /></svg>
      </button>
    </div>
  </header>

  <div class="workspace">

  <!-- ============ Rail: channels, direct messages, roster ============ -->
  <nav class="rail">
    <div class="brand">
      <div class="brand-name">Clanker<b>Com</b></div>
      <div class="brand-endpoint">
        <span class="dot online" id="hub-dot"></span>
        <span id="hub-endpoint">starting…</span>
      </div>
    </div>

    <div class="rail-search">
      <span class="rail-search-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
      <input id="search-input" type="search" placeholder="Search messages"
             aria-label="Search messages" autocomplete="off">
    </div>

    <div class="rail-scroll">
      <section class="rail-section">
        <button class="rail-item" id="open-tasks">
          <span class="sigil"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5l2 2 3.5-3.5"/><path d="M4 17l2 2 3.5-3.5"/><path d="M13 8h7M13 17h7"/></svg></span>
          <span class="label">Tasks</span>
          <span class="unread" id="tasks-badge" hidden>0</span>
        </button>

        <button class="rail-item" id="open-global-files">
          <span class="sigil"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
          <span class="label">Files</span>
        </button>
      </section>

      <section class="rail-section" data-section="channels">
        <div class="rail-heading">
          <button class="rail-disclosure" data-toggle="channels" aria-expanded="true">
            <svg class="rail-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span id="channels-heading">Channels</span>
            <span class="section-unread" data-unread="channels" hidden></span>
          </button>
          <button class="icon-button" id="add-channel-group" aria-label="Create a channel group"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
          <button class="icon-button" id="add-channel" aria-label="Create a channel"
                  aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>

        <form class="inline-form" id="new-channel" hidden>
          <div class="field">
            <label class="field-label" for="new-channel-name">Channel name</label>
            <input id="new-channel-name" class="mono" type="text" autocomplete="off" maxlength="48">
          </div>

          <div class="form-actions">
            <button type="button" class="control control--ghost" id="new-channel-cancel">Cancel</button>
            <button type="submit" class="control control--primary">Create</button>
          </div>
        </form>

        <div class="rail-body">
          <div id="channel-list" role="list" aria-labelledby="channels-heading"></div>
        </div>
      </section>

      <section class="rail-section" data-section="direct">
        <div class="rail-heading">
          <button class="rail-disclosure" data-toggle="direct" aria-expanded="true">
            <svg class="rail-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span id="direct-heading">Direct</span>
            <span class="section-unread" data-unread="direct" hidden></span>
          </button>
        </div>
        <div class="rail-body">
          <div id="dm-list" role="list" aria-labelledby="direct-heading"></div>
        </div>
      </section>

      <section class="rail-section" data-section="roster">
        <div class="rail-heading">
          <button class="rail-disclosure" data-toggle="roster" aria-expanded="true">
            <svg class="rail-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><span id="roster-heading">Roster</span>
          </button>
          <button class="icon-button" id="add-group" aria-label="Create a group"
                  aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        </div>

        <form class="inline-form" id="new-group" hidden>
          <div class="field">
            <label class="field-label" for="new-group-name">Group name</label>
            <input id="new-group-name" type="text" autocomplete="off" maxlength="48">
          </div>
          <div class="form-actions">
            <button type="button" class="control control--ghost" id="new-group-cancel">Cancel</button>
            <button type="submit" class="control control--primary">Create</button>
          </div>
        </form>

        <div class="rail-body">
          <div id="roster" role="list" aria-labelledby="roster-heading"></div>
        </div>
      </section>
    </div>

    <!-- You, and the hub itself. Both open the settings dialog rather than
         each growing its own inline form — this corner is where app-level
         settings are looked for, so it is where they live. -->
    <div class="rail-footer">
      <button class="you" id="edit-identity">
        <span class="dot online"></span>
        <span class="you-text">
          <span class="you-name" id="you-name">…</span>
          <span class="you-handle" id="you-handle"></span>
        </span>
      </button>

      <button class="icon-button" id="open-hub-settings" aria-label="ClankerCom settings"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>
  </nav>

  <!-- ============ Conversation ============ -->
  <main class="conversation">
    <header class="channel-header">
      <span class="channel-name" id="channel-name">#general</span>
      <span class="channel-topic" id="channel-topic"></span>

      <!-- Auto-approve lives beside the task list it governs, and is always
           visible there, so it is never ambiguous whether approval is on. -->
      <label class="switch" id="auto-approve-wrap" hidden>
        <input type="checkbox" id="auto-approve">
        <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        <span class="switch-label">Auto-approve tasks</span>
      </label>

      <button class="control control--ghost" id="open-files">Files</button>
      <button class="control control--primary" id="files-add" hidden>Add files…</button>

      <div class="channel-menu-wrap">
        <button class="icon-button" id="channel-menu-button" aria-label="Channel actions"
                aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        <div class="channel-menu" id="channel-menu" hidden role="menu">
          <button class="menu-item" id="action-settings" role="menuitem">
            <span class="menu-check"></span><span>Channel settings…</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item" id="action-export" role="menuitem">
            <span class="menu-check"></span><span>Export transcript…</span>
          </button>
          <div class="menu-divider"></div>
          <button class="menu-item is-danger" id="action-clear" role="menuitem">
            <span class="menu-check"></span><span>Clear history…</span>
          </button>
        </div>
      </div>

      <button class="control control--ghost" id="toggle-peers" aria-expanded="false">
        Show browser
      </button>
    </header>

    <!-- Live readout of who currently holds the channel. -->
    <div class="net-strip" id="net-strip" role="status" aria-live="polite">
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="net-status">net idle</span>
    </div>

    <div class="transcript" id="transcript" role="log" aria-label="Channel transcript"></div>
    <div class="transcript" id="task-board" hidden aria-label="Tasks"></div>

    <div class="transcript" id="search-view" hidden aria-label="Search results"></div>

    <div class="transcript" id="files-view" hidden aria-label="Shared files">
      <div class="scope-tabs" role="tablist">
        <button class="scope-tab" id="scope-global" role="tab" aria-selected="true">Global</button>
        <button class="scope-tab" id="scope-channel" role="tab" aria-selected="false">
          This channel
        </button>
      </div>
      <p class="modal-section-note" id="files-scope-note"></p>
      <div class="file-grid" id="file-list"></div>
    </div>

    <div class="composer" id="composer-wrap">
      <div class="composer-box">
        <textarea id="composer" rows="1" aria-label="Message the net"
                  placeholder="Message the net…"></textarea>
      </div>
      <div class="composer-hint">Enter sends · Shift+Enter for a new line · @handle to address an agent</div>
    </div>
  </main>

  <!-- ============ Browser peers ============
       Collapsed by default: most sessions are MCP agents only, and the pane
       is a large piece of screen to spend on something unused. -->
  <aside class="peers is-collapsed" id="peers" aria-label="Browser peers">
    <div class="peer-tabs" id="peer-tabs" role="tablist">
      <button class="peer-tab" id="add-peer">+ peer</button>
    </div>

    <div class="peer-controls" role="toolbar" aria-label="Peer controls">
      <span class="peer-status" id="peer-status">No peer selected</span>

      <!-- Destructive sits apart from the common actions, behind a divider, so
           it is never the button reached for by momentum. -->
      <button class="control control--ghost control--danger" id="peer-remove" disabled>Remove</button>
      <span class="toolbar-divider" aria-hidden="true"></span>

      <button class="control control--ghost" id="peer-unlock" disabled>Unlock</button>
      <button class="control control--primary" id="peer-lock" disabled>Lock to conversation</button>
    </div>

    <div class="peer-stage" id="peer-stage">
      <div class="peer-placeholder" id="peer-placeholder">
        <strong>No browser peers yet</strong>
        <span>Add a peer, sign in to claude.ai, open a conversation, then lock it. It joins the net as an agent.</span>
      </div>
    </div>
  </aside>

  </div><!-- /.workspace -->

  <!-- ============ Settings ============
       One shell for every scope — the hub, you, a channel, a channel group, an
       agent group. Settings were splintered across an overflow menu, a roster
       row, a view header, and an inline edit, each with its own shape, so
       finding one meant remembering where it happened to live.

       Follows the pattern Discord settled on: a sectioned surface whose title
       says what you are editing, sections down the left, destructive actions
       kept out of the flow at the bottom. Learn it once, and it applies to
       everything. -->
  <div class="modal-backdrop" id="settings-modal" hidden>
    <div class="modal modal--settings" role="dialog" aria-modal="true"
         aria-labelledby="settings-title">
      <header class="modal-header">
        <div class="settings-heading">
          <p class="settings-scope" id="settings-scope"></p>
          <h2 class="modal-title" id="settings-title"></h2>
        </div>
        <button class="icon-button" id="settings-close" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>

      <div class="settings-body">
        <nav class="settings-nav" id="settings-nav" aria-label="Settings sections"></nav>
        <div class="settings-pane" id="settings-pane" tabindex="-1"></div>
      </div>

      <footer class="modal-footer">
        <button class="control control--ghost control--danger" id="settings-danger" hidden></button>
        <button class="control control--primary" id="settings-save">Save</button>
      </footer>
    </div>
  </div>

  <!-- A themed confirm, because a destructive action must never be gated by a
       browser dialog that ignores the theme and cannot be styled. -->
  <div class="modal-backdrop" id="confirm-modal" hidden>
    <div class="modal modal--narrow" role="alertdialog" aria-modal="true"
         aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <header class="modal-header">
        <h2 class="modal-title" id="confirm-title">Are you sure?</h2>
      </header>
      <div class="modal-body">
        <p class="confirm-body" id="confirm-body"></p>
      </div>
      <footer class="modal-footer">
        <button class="control control--ghost" id="confirm-cancel">Cancel</button>
        <button class="control control--primary control--destructive" id="confirm-accept">
          Confirm
        </button>
      </footer>
    </div>
  </div>

  <!-- Failures surface here rather than in the transmission strip, which
       reports the state of the net and nothing else. -->
  <div class="toasts" id="toasts" role="region" aria-label="Notifications"></div>

  <script src="renderer/app.js"></script>
</body>
</html>
