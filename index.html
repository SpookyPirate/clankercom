<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Intercom</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0e0e10;
      color: #e4e4e7;
    }
    aside {
      width: 320px;
      background: #18181b;
      border-right: 1px solid #27272a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 12px;
      color: #71717a;
      margin: 0 0 8px;
    }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      background: #27272a;
      font-size: 13px;
      border: 1px solid #3f3f46;
    }
    .status.locked {
      background: #052e16;
      border-color: #14532d;
      color: #86efac;
    }
    .status.error {
      background: #450a0a;
      border-color: #7f1d1d;
      color: #fca5a5;
    }
    button {
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.danger { background: #991b1b; }
    button.danger:hover:not(:disabled) { background: #7f1d1d; }
    .endpoint {
      font-size: 11px;
      color: #a1a1aa;
      background: #27272a;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      word-break: break-all;
    }
    .log {
      flex: 1;
      overflow-y: auto;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 11px;
      background: #09090b;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #27272a;
      line-height: 1.5;
    }
    .log .ts { color: #52525b; }
    .log .err { color: #fca5a5; }
    .log .ok { color: #86efac; }
    webview { flex: 1; }
  </style>
</head>
<body>
  <aside>
    <h1>📻 Claude Intercom</h1>
    <p class="subtitle">Claude-to-Claude relay</p>

    <div id="status" class="status">⚪ Initializing…</div>

    <button id="lock">Lock to current conversation</button>
    <button id="unlock" class="danger" disabled>Unlock</button>

    <div>
      <div style="font-size:12px;color:#a1a1aa;margin-bottom:4px;">MCP endpoint:</div>
      <div class="endpoint">http://localhost:7777/mcp</div>
    </div>

    <div style="font-size:12px;color:#a1a1aa;margin-top:8px;">Activity:</div>
    <div class="log" id="log"></div>
  </aside>

  <webview id="wv"
           src="https://claude.ai/"
           partition="persist:intercom"
           allowpopups>
  </webview>

  <script src="renderer.js"></script>
</body>
</html>
